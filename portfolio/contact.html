<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Rithika | Portfolio</title>

    <meta name="description"
          content="Contact Rithika through the accessible portfolio contact form.">
    <meta name="author" content="Rithika">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<a class="skip-link" href="#main-content">Skip to main content</a>

<header class="site-header">
    <div class="container">
        <h1>Rithika</h1>

        <nav aria-label="Primary navigation">
            <ul class="nav-list">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    </div>
</header>

<main id="main-content">

    <section class="content-section" aria-labelledby="contact-title">
        <div class="container">

            <h2 id="contact-title">Contact Me</h2>

            <form action="#" method="post" aria-describedby="form-description">

                <p id="form-description">
                    All fields marked with an asterisk (*) are required.
                </p>

                <div class="form-group">
                    <label for="name">Name *</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required
                        aria-required="true">
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                        aria-required="true">
                </div>

                <div class="form-group">
                    <label for="subject">Subject *</label>
                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        required
                        aria-required="true">
                </div>

                <div class="form-group">
                    <label for="message">Message *</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required
                        aria-required="true"></textarea>
                </div>

                <button type="submit">Send Message</button>

            </form>

        </div>
    </section>

</main>

<footer class="site-footer">
    <div class="container">
        <p>&copy; 2026 Rithika. All rights reserved.</p>
    </div>
</footer>

</body>
</html>
