<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="ShopEasy E-Commerce Product Catalog">

    <title>ShopEasy - E-Commerce Store</title>

    <style>

        /* =========================
           GLOBAL STYLES
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --dark: #1e293b;
            --light: #f8fafc;
            --white: #ffffff;
            --danger: #dc2626;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--light);
            color: #222;
            min-height: 100vh;
        }

        /* =========================
           NAVIGATION
        ========================= */

        header {
            background: var(--dark);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar {
            max-width: 1200px;
            margin: auto;

            padding: 18px 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #60a5fa;
            font-size: 28px;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .nav-links a:hover {
            color: #60a5fa;
        }

        #cartCount {
            background: #ef4444;
            color: white;

            padding: 3px 8px;

            border-radius: 20px;

            font-size: 13px;
        }

        /* =========================
           HERO SECTION
        ========================= */

        .hero {
            min-height: 450px;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 30px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );
        }

        .hero h2 {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 20px;
            margin-bottom: 25px;
        }

        /* =========================
           BUTTON
        ========================= */

        .btn {
            display: inline-block;

            border: none;
            border-radius: 8px;

            padding: 12px 22px;

            background: var(--primary);
            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            text-decoration: none;

            transition: 0.3s;
        }

        .btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .delete-btn {
            background: var(--danger);
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        /* =========================
           PRODUCTS
        ========================= */

        .products-section {
            max-width: 1200px;

            margin: auto;

            padding: 60px 25px;
        }

        .products-section h2 {
            text-align: center;

            font-size: 35px;

            margin-bottom: 30px;
        }

        .search-box {
            display: block;

            width: 100%;
            max-width: 500px;

            margin: 0 auto 40px;

            padding: 15px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 16px;

            outline: none;
        }

        .search-box:focus {
            border-color: var(--primary);
        }

        .product-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(230px, 1fr)
                );

            gap: 25px;
        }

        .product-card {
            background: white;

            border-radius: 15px;

            padding: 20px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.08);

            transition: 0.3s;

            text-align: center;
        }

        .product-card:hover {
            transform: translateY(-7px);

            box-shadow:
                0 10px 25px
                rgba(0, 0, 0, 0.15);
        }

        .product-card img {
            width: 100%;

            height: 200px;

            object-fit: contain;

            margin-bottom: 15px;
        }

        .product-card h3 {
            font-size: 20px;

            margin-bottom: 10px;
        }

        .product-card p {
            color: #666;

            line-height: 1.5;

            margin-bottom: 10px;
        }

        .price {
            color: var(--primary) !important;

            font-size: 22px;

            font-weight: bold;
        }

        /* =========================
           CART
        ========================= */

        .cart-section {
            max-width: 900px;

            margin: auto;

            padding: 60px 25px;

            min-height: 500px;
        }

        .cart-section h2 {
            text-align: center;

            font-size: 35px;

            margin-bottom: 30px;
        }

        .cart-item {
            background: white;

            padding: 20px;

            margin-bottom: 15px;

            border-radius: 12px;

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            box-shadow:
                0 3px 10px
                rgba(0, 0, 0, 0.08);
        }

        .cart-item h3 {
            margin-bottom: 8px;
        }

        .cart-item p {
            color: var(--primary);

            font-weight: bold;

            font-size: 18px;
        }

        .cart-total {
            text-align: right;

            margin-top: 25px;

            font-size: 25px;

            font-weight: bold;
        }

        .empty-cart {
            text-align: center;

            font-size: 20px;

            color: #666;

            padding: 50px;
        }

        /* =========================
           ABOUT / CONTACT
        ========================= */

        .content-section {
            max-width: 900px;

            min-height: 500px;

            margin: auto;

            padding: 80px 25px;

            text-align: center;
        }

        .content-section h2 {
            font-size: 35px;

            margin-bottom: 25px;

            color: var(--primary);
        }

        .content-section p {
            font-size: 18px;

            line-height: 1.8;

            color: #555;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            background: var(--dark);

            color: white;

            text-align: center;

            padding: 25px;
        }

        /* =========================
           RESPONSIVE DESIGN
        ========================= */

        @media (max-width: 700px) {

            .navbar {
                flex-direction: column;

                gap: 15px;
            }

            .nav-links {
                flex-wrap: wrap;

                justify-content: center;

                gap: 15px;
            }

            .hero h2 {
                font-size: 35px;
            }

            .hero p {
                font-size: 17px;
            }

            .cart-item {
                flex-direction: column;

                gap: 15px;

                text-align: center;
            }

            .cart-total {
                text-align: center;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVIGATION
    ========================== -->

    <header>

        <nav class="navbar">

            <h1 class="logo">
                ShopEasy
            </h1>

            <div class="nav-links">

                <a href="#home">
                    Home
                </a>

                <a href="#products">
                    Products
                </a>

                <a href="#about">
                    About
                </a>

                <a href="#contact">
                    Contact
                </a>

                <a href="#cart">
                    🛒 Cart
                    <span id="cartCount">
                        0
                    </span>
                </a>

            </div>

        </nav>

    </header>


    <!-- =========================
         MAIN APPLICATION
    ========================== -->

    <main id="app"></main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            © 2026 ShopEasy |
            E-Commerce Capstone Project
        </p>

    </footer>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        /* =========================
           PRODUCT DATA
        ========================== */

        const products = [

            {
                id: 1,

                name: "Wireless Headphones",

                price: 2499,

                image:
                    "https://placehold.co/400x300?text=Headphones",

                description:
                    "High-quality wireless headphones with clear sound."
            },

            {
                id: 2,

                name: "Smart Watch",

                price: 3999,

                image:
                  "https://placehold.co/400x300?text=Smart+Watch",

                description:
                    "Smart watch with fitness and health tracking."
            },

            {
                id: 3,

                name: "Laptop",

                price: 59999,

                image:
                    "https://placehold.co/400x300?text=Laptop",

                description:
                    "Powerful laptop suitable for work and entertainment."
            },

            {
                id: 4,

                name: "Smartphone",

                price: 29999,

                image:
                    "https://placehold.co/400x300?text=Smartphone",

                description:
                    "Modern smartphone with advanced features."
            },

            {
                id: 5,

                name: "Bluetooth Speaker",

                price: 1999,

                image:
                    "https://placehold.co/400x300?text=Speaker",

                description:
                    "Portable Bluetooth speaker with powerful sound."
            },

            {
                id: 6,

                name: "Gaming Mouse",

                price: 1499,

                image:
                    "https://placehold.co/400x300?text=Gaming+Mouse",

                description:
                    "High precision mouse for gaming."
            },

            {
                id: 7,

                name: "Keyboard",

                price: 1799,

                image:
                    "https://placehold.co/400x300?text=Keyboard",

                description:
                    "Comfortable mechanical keyboard."
            },

            {
                id: 8,

                name: "Tablet",

                price: 18999,

                image:
                    "https://placehold.co/400x300?text=Tablet",

                description:
                    "Lightweight tablet for entertainment and study."
            }

        ];


        /* =========================
           SHOPPING CART
        ========================== */

        let cart =
            JSON.parse(
                localStorage.getItem("cart")
            ) || [];


        /* =========================
           UPDATE CART COUNT
        ========================== */

        function updateCartCount() {

            document.getElementById(
                "cartCount"
            ).textContent = cart.length;

        }


        /* =========================
           SAVE CART
        ========================== */

        function saveCart() {

            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );

        }


        /* =========================
           ADD PRODUCT
        ========================== */

        function addToCart(id) {

            const product =
                products.find(
                    item => item.id === id
                );

            cart.push(product);

            saveCart();

            updateCartCount();

            alert(
                product.name +
                " added to cart!"
            );

        }


        /* =========================
           REMOVE PRODUCT
        ========================== */

        function removeFromCart(index) {

            cart.splice(index, 1);

            saveCart();

            updateCartCount();

            showCart();

        }


        /* =========================
           ROUTER
        ========================== */

        function router() {

            const route =
                location.hash.substring(1)
                || "home";


            if (route === "home") {

                showHome();

            }

            else if (route === "products") {

                showProducts();

            }

            else if (route === "cart") {

                showCart();

            }

            else if (route === "about") {

                showAbout();

            }

            else if (route === "contact") {

                showContact();

            }

            else {

                showHome();

            }

        }


        /* =========================
           HOME PAGE
        ========================== */

        function showHome() {

            document.getElementById(
                "app"
            ).innerHTML = `

                <section class="hero">

                    <h2>
                        Welcome to ShopEasy
                    </h2>

                    <p>
                        Discover quality products
                        at affordable prices.
                    </p>

                    <a
                        href="#products"
                        class="btn">

                        Shop Now

                    </a>

                </section>

            `;

        }


        /* =========================
           PRODUCTS PAGE
        ========================== */

        function showProducts() {

            document.getElementById(
                "app"
            ).innerHTML = `

                <section
                    class="products-section">

                    <h2>
                        Our Products
                    </h2>

                    <input
                        type="text"
                        id="searchBox"
                        class="search-box"
                        placeholder="Search products..."
                    >

                    <div
                        id="productGrid"
                        class="product-grid">

                    </div>

                </section>

            `;


            displayProducts(products);


            document.getElementById(
                "searchBox"
            ).addEventListener(
                "input",
                searchProducts
            );

        }


        /* =========================
           DISPLAY PRODUCTS
        ========================== */

        function displayProducts(list) {

            const grid =
                document.getElementById(
                    "productGrid"
                );


            if (list.length === 0) {

                grid.innerHTML = `

                    <p>
                        No products found.
                    </p>

                `;

                return;

            }


            grid.innerHTML =
                list.map(product => `

                    <div class="product-card">

                        <img
                            src="${product.image}"
                            alt="${product.name}"
                            loading="lazy"
                        >

                        <h3>
                            ${product.name}
                        </h3>

                        <p>
                            ${product.description}
                        </p>

                        <p class="price">
                            ₹${product.price}
                        </p>

                        <button
                            class="btn"
                            onclick="addToCart(${product.id})">

                            Add to Cart

                        </button>

                    </div>

                `).join("");

        }


        /* =========================
           PRODUCT SEARCH
        ========================== */

        function searchProducts(event) {

            const text =
                event.target.value
                .toLowerCase()
                .trim();


            const filtered =
                products.filter(product =>

                    product.name
                        .toLowerCase()
                        .includes(text)

                );


            displayProducts(filtered);

        }


        /* =========================
           CART PAGE
        ========================== */

        function showCart() {

            let total = 0;


            let cartHTML = "";


            if (cart.length === 0) {

                cartHTML = `

                    <div class="empty-cart">

                        <p>
                            Your cart is empty.
                        </p>

                        <br>

                        <a
                            href="#products"
                            class="btn">

                            Browse Products

                        </a>

                    </div>

                `;

            }

            else {

                cartHTML =
                    cart.map(
                        (product, index) => {

                            total +=
                                product.price;


                            return `

                                <div
                                    class="cart-item">

                                    <div>

                                        <h3>
                                            ${product.name}
                                        </h3>

                                        <p>
                                            ₹${product.price}
                                        </p>

                                    </div>

                                    <button
                                        class="btn delete-btn"
                                        onclick="removeFromCart(${index})">

                                        Remove

                                    </button>

                                </div>

                            `;

                        }
                    ).join("");

            }


            document.getElementById(
                "app"
            ).innerHTML = `

                <section class="cart-section">

                    <h2>
                        Shopping Cart
                    </h2>

                    ${cartHTML}

                    ${
                        cart.length > 0
                        ? `

                            <div class="cart-total">

                                Total:
                                ₹${total}

                            </div>

                            <br>

                            <div
                                style="text-align:right">

                                <button
                                    class="btn"
                                    onclick="checkout()">

                                    Checkout

                                </button>

                            </div>

                        `
                        : ""
                    }

                </section>

            `;

        }


        /* =========================
           CHECKOUT
        ========================== */

        function checkout() {

            if (cart.length === 0) {

                alert(
                    "Your cart is empty."
                );

                return;

            }


            alert(
                "Thank you for shopping with ShopEasy!"
            );


            cart = [];

            saveCart();

            updateCartCount();

            showCart();

        }


        /* =========================
           ABOUT PAGE
        ========================== */

        function showAbout() {

            document.getElementById(
                "app"
            ).innerHTML = `

                <section
                    class="content-section">

                    <h2>
                        About ShopEasy
                    </h2>

                    <p>
                        ShopEasy is a modern
                        e-commerce product catalog
                        created as a Web Development
                        Capstone Project.
                    </p>

                    <br>

                    <p>
                        This application demonstrates
                        responsive design, modular
                        architecture, client-side
                        routing, product searching,
                        shopping cart functionality
                        and browser local storage.
                    </p>

                </section>

            `;

        }


        /* =========================
           CONTACT PAGE
        ========================== */

        function showContact() {

            document.getElementById(
                "app"
            ).innerHTML = `

                <section
                    class="content-section">

                    <h2>
                        Contact Us
                    </h2>

                    <p>
                        📧 Email:
                        support@shopeasy.com
                    </p>

                    <p>
                        📞 Phone:
                        +91 98765 43210
                    </p>

                    <p>
                        📍 Location:
                        Chennai, India
                    </p>

                </section>

            `;

        }


        /* =========================
           ROUTING EVENT
        ========================== */

        window.addEventListener(
            "hashchange",
            router
        );


        /* =========================
           PAGE LOAD
        ========================== */

        window.addEventListener(
            "load",
            function() {

                router();

                updateCartCount();

            }
        );

    </script>

</body>

</html>
