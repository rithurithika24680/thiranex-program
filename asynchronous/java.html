<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Real-Time Weather Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #4facfe, #00f2fe);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            text-align: center;
        }

        h1 {
            color: white;
            margin-bottom: 10px;
        }

        .subtitle {
            color: white;
            margin-bottom: 25px;
        }

        /* Search Box */

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
            padding: 15px;

            border: none;
            border-radius: 10px;

            font-size: 16px;
            outline: none;
        }

        .search-box button {
            padding: 15px 25px;

            border: none;
            border-radius: 10px;

            background: #222;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        .search-box button:hover {
            background: #444;
        }

        /* Message */

        #message {
            color: white;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* Weather Card */

        .weather-card {
            background: white;

            border-radius: 20px;

            padding: 30px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .hidden {
            display: none;
        }

        .location h2 {
            font-size: 30px;
            color: #222;
        }

        .location p {
            color: #666;
            margin-top: 5px;
        }

        /* Main Weather */

        .weather-main {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 40px;

            margin: 30px 0;
        }

        .temperature {
            font-size: 60px;
            font-weight: bold;
            color: #2196f3;
        }

        #weatherDescription {
            font-size: 18px;
            font-weight: bold;
        }

        #weatherIcon {
            font-size: 45px;
            margin-top: 10px;
        }

        /* Weather Details */

        .weather-details {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 15px;
        }

        .weather-item {
            background: #f2f8fc;

            padding: 20px;

            border-radius: 15px;
        }

        .weather-item span {
            font-size: 30px;
        }

        .weather-item h3 {
            margin: 8px 0;
            color: #444;
        }

        .weather-item p {
            font-size: 20px;
            font-weight: bold;
            color: #2196f3;
        }

        .updated {
            margin-top: 25px;
            color: #777;
            font-size: 14px;
        }

        /* Mobile Design */

        @media (max-width: 600px) {

            h1 {
                font-size: 25px;
            }

            .search-box {
                flex-direction: column;
            }

            .search-box button {
                width: 100%;
            }

            .weather-main {
                flex-direction: column;
                gap: 10px;
            }

            .weather-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🌤️ Real-Time Weather Dashboard</h1>

        <p class="subtitle">
            Search for live weather information
        </p>

        <!-- Search Section -->

        <div class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name">

            <button onclick="searchWeather()">
                Search
            </button>

        </div>

        <!-- Error / Loading Message -->

        <div id="message"></div>

        <!-- Weather Card -->

        <div id="weatherCard"
             class="weather-card hidden">

            <div class="location">

                <h2 id="cityName">--</h2>

                <p id="countryName">--</p>

            </div>

            <!-- Temperature -->

            <div class="weather-main">

                <div class="temperature">

                    <span id="temperature">
                        --
                    </span>°C

                </div>

                <div>

                    <p id="weatherDescription">
                        --
                    </p>

                    <p id="weatherIcon">
                        🌤️
                    </p>

                </div>

            </div>

            <!-- Weather Details -->

            <div class="weather-details">

                <div class="weather-item">

                    <span>💧</span>

                    <h3>Humidity</h3>

                    <p id="humidity">
                        --%
                    </p>

                </div>

                <div class="weather-item">

                    <span>💨</span>

                    <h3>Wind Speed</h3>

                    <p id="windSpeed">
                        -- km/h
                    </p>

                </div>

                <div class="weather-item">

                    <span>🌡️</span>

                    <h3>Feels Like</h3>

                    <p id="feelsLike">
                        --°C
                    </p>

                </div>

                <div class="weather-item">

                    <span>📊</span>

                    <h3>Pressure</h3>

                    <p id="pressure">
                        -- hPa
                    </p>

                </div>

            </div>

            <div class="updated">

                Last Updated:
                <span id="updatedTime">
                    --
                </span>

            </div>

        </div>

    </div>


    <script>

        // Weather code descriptions

        const weatherCodes = {

            0: ["Clear Sky", "☀️"],

            1: ["Mainly Clear", "🌤️"],

            2: ["Partly Cloudy", "⛅"],

            3: ["Overcast", "☁️"],

            45: ["Fog", "🌫️"],

            48: ["Fog", "🌫️"],

            51: ["Light Drizzle", "🌦️"],

            53: ["Moderate Drizzle", "🌦️"],

            55: ["Heavy Drizzle", "🌧️"],

            61: ["Light Rain", "🌦️"],

            63: ["Moderate Rain", "🌧️"],

            65: ["Heavy Rain", "🌧️"],

            71: ["Light Snow", "🌨️"],

            73: ["Moderate Snow", "❄️"],

            75: ["Heavy Snow", "❄️"],

            80: ["Rain Showers", "🌦️"],

            81: ["Moderate Rain Showers", "🌧️"],

            82: ["Heavy Rain Showers", "⛈️"],

            95: ["Thunderstorm", "⛈️"],

            96: ["Thunderstorm with Hail", "⛈️"],

            99: ["Heavy Thunderstorm", "⛈️"]

        };


        // Main function

        async function searchWeather() {

            const city =
                document.getElementById("cityInput")
                .value
                .trim();

            const message =
                document.getElementById("message");

            const weatherCard =
                document.getElementById("weatherCard");


            // Check empty input

            if (city === "") {

                message.textContent =
                    "Please enter a city name.";

                return;
            }


            message.textContent =
                "Loading weather data...";

            weatherCard.classList.add("hidden");


            try {

                // Get city coordinates

                const locationURL =
                    "https://geocoding-api.open-meteo.com/v1/search"
                    + "?name="
                    + encodeURIComponent(city)
                    + "&count=1"
                    + "&language=en"
                    + "&format=json";


                const locationResponse =
                    await fetch(locationURL);


                // Check HTTP error

                if (!locationResponse.ok) {

                    throw new Error(
                        "Unable to find the city."
                    );
                }


                // Convert response to JSON

                const locationData =
                    await locationResponse.json();


                // Check city exists

                if (!locationData.results) {

                    throw new Error(
                        "City not found."
                    );
                }


                const location =
                    locationData.results[0];


                // Get latitude and longitude

                const latitude =
                    location.latitude;

                const longitude =
                    location.longitude;


                // Weather API

                const weatherURL =
                    "https://api.open-meteo.com/v1/forecast"
                    + "?latitude=" + latitude
                    + "&longitude=" + longitude
                    + "&current="
                    + "temperature_2m,"
                    + "relative_humidity_2m,"
                    + "apparent_temperature,"
                    + "pressure_msl,"
                    + "wind_speed_10m,"
                    + "weather_code"
                    + "&timezone=auto";


                const weatherResponse =
                    await fetch(weatherURL);


                if (!weatherResponse.ok) {

                    throw new Error(
                        "Unable to fetch weather data."
                    );
                }


                // Convert JSON response

                const weatherData =
                    await weatherResponse.json();


                // Display weather

                displayWeather(
                    location,
                    weatherData
                );


                message.textContent = "";


            }

            catch (error) {

                console.error(error);

                message.textContent =
                    "Error: " + error.message;

            }

        }


        // Display weather data

        function displayWeather(
            location,
            weatherData
        ) {

            // Access nested JSON object

            const current =
                weatherData.current;


            document.getElementById(
                "cityName"
            ).textContent =
                location.name;


            document.getElementById(
                "countryName"
            ).textContent =
                location.country;


            document.getElementById(
                "temperature"
            ).textContent =
                Math.round(
                    current.temperature_2m
                );


            document.getElementById(
                "humidity"
            ).textContent =
                current.relative_humidity_2m
                + "%";


            document.getElementById(
                "windSpeed"
            ).textContent =
                current.wind_speed_10m
                + " km/h";


            document.getElementById(
                "feelsLike"
            ).textContent =
                Math.round(
                    current.apparent_temperature
                )
                + "°C";


            document.getElementById(
                "pressure"
            ).textContent =
                Math.round(
                    current.pressure_msl
                )
                + " hPa";


            // Weather description

            const code =
                current.weather_code;


            const weatherInfo =
                weatherCodes[code]
                || ["Unknown", "🌡️"];


            document.getElementById(
                "weatherDescription"
            ).textContent =
                weatherInfo[0];


            document.getElementById(
                "weatherIcon"
            ).textContent =
                weatherInfo[1];


            // Last updated time

            document.getElementById(
                "updatedTime"
            ).textContent =
                new Date(
                    current.time
                ).toLocaleString();


            // Show weather card

            document.getElementById(
                "weatherCard"
            ).classList.remove("hidden");

        }

    </script>

</body>

</html>
